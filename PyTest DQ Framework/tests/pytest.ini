[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    parquet_data: production data quality checks for Parquet datasets
    smoke: lightweight dataset availability checks
    example: framework example tests, excluded from production DQ runs
    facility_name_min_time_spent_per_visit_date: checks for the facility-name minimum-time dataset
    facility_type_avg_time_spent_per_visit_date: checks for the facility-type average-time dataset
    patient_sum_treatment_cost_per_facility_type: checks for the patient treatment-cost dataset
